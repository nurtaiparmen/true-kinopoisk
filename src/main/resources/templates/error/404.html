<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Страница не найдена — Кинопоиск</title>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>

    <header th:replace="~{fragments/layout :: header}"></header>
    <div th:replace="~{fragments/layout :: mobileMenu}"></div>

    <main>
        <section class="not-found">
            <div class="container">
                <span class="not-found__code">404</span>
                <h1 class="not-found__title">Страница не найдена</h1>
                <p class="not-found__text" th:text="${message} ?: 'Такого фильма или страницы не существует. Возможно, ссылка устарела или в адресе опечатка.'">
                    Такого фильма или страницы не существует.
                </p>
                <a th:href="@{/}" class="btn-watch">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                    На главную
                </a>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: toastAndScript}"></th:block>
</body>
</html>
