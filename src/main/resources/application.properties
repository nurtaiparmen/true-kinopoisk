spring.application.name=kinopoisk

# ---------- База данных H2 (в памяти, не требует установки) ----------
spring.datasource.url=jdbc:h2:mem:kinopoisk;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate сам создаёт таблицы по сущностям при старте
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- H2 Console: http://localhost:8080/h2-console ----------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ---------- Сервер ----------
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
# Для любых несуществующих адресов Spring Boot сам отдаст шаблон templates/error/404.html

server.port=${PORT:8080}